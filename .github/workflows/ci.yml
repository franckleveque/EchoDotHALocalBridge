name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Unit & ArchUnit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Installer OpenGrep 1.33.1
        run: |
          curl -fsSL -o /usr/local/bin/opengrep https://github.com/opengrep/opengrep/releases/download/v1.33.1/opengrep_manylinux_x86
          chmod +x /usr/local/bin/opengrep
          opengrep --version

      # Exit 0 = aucune violation ; tout autre code (codes OpenGrep) fait échouer l'étape.
      # Le rapport va dans le résumé du job quel que soit le résultat ; les logs
      # sont dans un groupe replié du log de l'étape.
      - name: Règles d'architecture (OpenGrep)
        run: |
          set +e
          opengrep scan -f .opengrep/architecture.yml --error --text-output=opengrep-report.txt . > opengrep.log 2>&1
          exit_code=$?
          set -e
          {
            echo "## Règles d'architecture OpenGrep (exit code ${exit_code})"
            echo
            if [ -s opengrep-report.txt ]; then echo '```'; cat opengrep-report.txt; echo '```'; else echo "Aucune violation, ou aucun rapport produit : voir le groupe « Logs OpenGrep » du log de l'étape."; fi
          } | tee -a "$GITHUB_STEP_SUMMARY"
          echo "::group::Logs OpenGrep"
          cat opengrep.log
          echo "::endgroup::"
          exit "${exit_code}"
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Run Tests with Coverage
        run: go test -v -tags e2e -coverprofile=coverage.out -coverpkg=./... ./...
      - name: Code Coverage Report
        run: go tool cover -func=coverage.out
      - name: Verify Coverage
        run: |
          # Domain coverage must be 100%
          # (Domain tests don't need e2e tag, but we use it for consistency if needed)
          go test -v -coverprofile=domain.out ./internal/domain/... || exit 1
          DOMAIN_COV=$(go tool cover -func=domain.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "Domain Coverage: $DOMAIN_COV%"
          if [ "$DOMAIN_COV" != "100.0" ]; then
            echo "Domain coverage must be 100%"
            exit 1
          fi

          # Global coverage (including all but SSDP and main entry point) should be >= 70% with E2E tests
          TESTABLE_PKGS=$(go list -tags e2e ./... | grep -v 'adapters/input/ssdp' \
                                      | grep -v 'cmd/bridge' \
                                      | tr '\n' ' ')
          go test -v -tags e2e -coverprofile=global.out -coverpkg=./... $TESTABLE_PKGS || exit 1
          GLOBAL_COV=$(go tool cover -func=global.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "Global Coverage (with E2E): $GLOBAL_COV%"
          if [ "$(echo "$GLOBAL_COV 70" | awk '{if ($1 < $2) print 1; else print 0}')" -eq 1 ]; then
            echo "Global coverage (with E2E) is below 70%"
            exit 1
          fi

  build:
    name: Build & Scan
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Local Image for Scanning
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: hue-bridge-emulator:scan
          load: true
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'hue-bridge-emulator:scan'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
      - name: Build Multi-arch Image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          tags: hue-bridge-emulator:latest
